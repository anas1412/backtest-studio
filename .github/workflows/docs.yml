name: Docs

# Builds the website in docs/ (VitePress) and publishes it to GitHub Pages:
# https://anas1412.github.io/backtest-studio/
on:
  push:
    branches: [main]
    paths: ['docs/**', 'CHANGELOG.md', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # "last updated" dates come from git history
      - uses: oven-sh/setup-bun@v2
      - name: Build
        working-directory: docs
        run: bun install --frozen-lockfile && bun run docs:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
